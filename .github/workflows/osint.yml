name: OSINT Digest
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: osint-digest
  cancel-in-progress: false

jobs:
  digest:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run collector
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'none' }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          ALLOW_PAID_AI: ${{ vars.ALLOW_PAID_AI || 'false' }}
        run: python bot.py
      - name: Persist delivery and retry state even after a partial failure
        if: always()
        shell: bash
        run: |
          if [ ! -f state/state.json ]; then exit 0; fi
          git config user.name 'OSINT Digest'
          git config user.email 'osint-digest@users.noreply.github.com'
          git add -f state/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update OSINT delivery state [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
